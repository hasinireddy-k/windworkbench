services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_API_BASE=https://data.elexon.co.uk/bmrs/api/v1
      - ALLOWED_ORIGINS=*
      - CACHE_ENABLED=true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
